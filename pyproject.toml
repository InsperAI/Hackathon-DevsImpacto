[project]
name = "beacon"
version = "0.1.0"
description = "Voice-first browser controller for blind users"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "browser-use>=0.9.1",
    "openai>=1.109.1",
    "python-dotenv>=1.1.1",
    "sounddevice>=0.5.3",
    "soundfile>=0.13.1",
    "pynput>=1.7.7",
    "simpleaudio>=1.0.4",
    "scipy>=1.16.2",
    "playsound3>=3.2.8",
    "librosa>=0.11.0",
]
